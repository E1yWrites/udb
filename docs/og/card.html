<!doctype html>
<!-- The link-preview card, public/og.png (1200×630). Rendered once with Playwright;
     see docs/deploy.md ("Link preview image") for the command. The booklet cover
     at card size: no counts, so it never goes stale. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>UDB link preview card</title>
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 300 700; src: url('../../public/fonts/fredoka-latin-wght.woff2') format('woff2-variations'); }
  :root { --cover: #49aa57; --band: #0d1a10; --yellow: #ffd52e; --ink: #13200f; --paper: #f6f2df; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--cover); font-family: 'Fredoka', sans-serif; color: var(--ink); position: relative; }
  .band { height: 64px; background: var(--band); display: flex; align-items: center; justify-content: space-between; padding: 0 48px; color: var(--yellow); font: 600 20px/1 'Fredoka'; letter-spacing: 0.18em; text-transform: uppercase; }
  .band span:last-child { color: var(--paper); letter-spacing: 0.06em; font-size: 17px; }
  .front { position: absolute; left: 48px; top: 118px; width: 640px; }
  svg { width: 440px; display: block; }
  .wm-drop, .wm-edge { stroke: var(--band); }
  .wm-fill { stroke: var(--yellow); }
  h1 { margin-top: 18px; font: 650 48px/1.05 'Fredoka'; }
  p { margin-top: 16px; font: 500 28px/1.3 'Fredoka'; max-width: 600px; }
  .start { margin-top: 26px; display: inline-flex; align-items: center; gap: 14px; height: 64px; padding: 0 28px 0 8px; border-radius: 999px; background: var(--band); color: var(--yellow); font: 600 26px/1 'Fredoka'; }
  .start b { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; background: var(--yellow); color: var(--band); font-size: 12px; }
  .dee { position: absolute; right: 70px; bottom: -28px; height: 560px; filter: drop-shadow(14px 14px 0 rgb(13 26 16 / 0.35)); }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: var(--band); }
</style>
</head>
<body>
  <div class="band"><span>Instruction booklet</span><span>udb.lorenzmalabanan.com</span></div>
  <div class="front">
    <svg viewBox="-14 -14 310 140" aria-label="UDB">
      <defs><path id="w" d="M12 12V58A30 30 0 0 0 72 58V12M112 12V88H138A38 38 0 0 0 138 12ZM216 12V88M216 12H244A19 19 0 0 1 244 50H216M216 50H248A19 19 0 0 1 248 88H216" /></defs>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <use href="#w" class="wm-drop" stroke-width="40" transform="translate(0 10)" />
        <use href="#w" class="wm-edge" stroke-width="40" />
        <use href="#w" class="wm-fill" stroke-width="24" />
      </g>
    </svg>
    <h1>Universal Driver Bus</h1>
    <p>Mouse, keyboard and headset settings in your browser. Only what the device sends back.</p>
    <span class="start"><b>START</b>Free · open source · nothing uploaded</span>
  </div>
  <img class="dee" src="../../public/brand/dee.webp" alt="" />
  <span class="foot"></span>
</body>
</html>
