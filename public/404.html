* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #0d1a10; color: #13200f; font: 400 16px/1.5 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; }
main { width: min(720px, 100%); display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; padding: clamp(24px, 5vw, 48px); background: #f6f2df; border: 3px solid #49aa57; border-radius: 18px; box-shadow: 0 30px 50px -30px #000; }
img { width: 120px; height: auto; rotate: -8deg; }
.chip { vertical-align: 0.35em; display: inline-block; padding: 4px 10px; border-radius: 999px; background: #0d1a10; color: #ffd52e; font: 600 13px/1 'Fredoka', sans-serif; }
h1 { text-wrap: balance; margin: 0 0 8px; font: 700 clamp(30px, 6vw, 44px)/1.02 'Fredoka', sans-serif; color: #1e4d2b; }
p { margin: 0 0 20px; color: #3f4d35; max-width: 46ch; }
a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 2px solid #13200f; background: #ffd52e; color: #1d1a05; font: 600 17px/1 'Fredoka', sans-serif; text-decoration: none; }
a:hover { background: #f0c71f; }
a:focus-visible { outline: 3px solid #1e6b34; outline-offset: 3px; }
@media (max-width: 520px) { main { grid-template-columns: 1fr; justify-items: start; } img { width: 90px; } }
</style>
